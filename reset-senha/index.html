<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — CV CRM</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  body { display: block; min-height: 100vh; }
  .login-overlay { position: static; inset: auto; opacity: 1; visibility: visible; }
  .login-overlay.hidden { display: none; }
</style>
</head>
<body>

<div class="login-overlay" id="resetOverlay">
  <div class="login-card">
    <!-- Estado inicial: verificando o link. JS troca pra "nova senha",
         "sucesso" ou "link inválido" assim que souber qual é o caso. -->
    <div class="login-icon" aria-hidden="true">CV</div>
    <h2>Redefinir senha</h2>
    <p class="subtitle" id="resetStatusMsg">Verificando o link...</p>
  </div>
</div>

<script type="module" src="/src/reset-senha.js"></script>
</body>
</html>
