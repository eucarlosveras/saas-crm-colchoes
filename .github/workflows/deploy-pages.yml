name: Deploy GitHub Pages

# Gera config.js a partir dos Secrets do repositório (SUPABASE_URL, SUPABASE_ANON_KEY)
# e publica o site no GitHub Pages. O config.js nunca fica versionado no repositório —
# só existe dentro do artefato de deploy gerado por este workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Gerar config.js a partir dos Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node gerar-config.js

      - name: Preparar pasta do site
        run: |
          mkdir -p site
          cp index.html style.css app.js config.js site/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
