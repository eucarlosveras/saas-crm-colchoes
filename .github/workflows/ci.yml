name: CI

# Builda o app em todo PR/push para pegar erro de build antes do deploy.
# Os testes de integração (tests/) só rodam de verdade se o secret
# SUPABASE_SERVICE_ROLE_KEY estiver configurado no repositório — sem ele, o
# step apenas avisa e sai com sucesso (não falha o CI por falta de uma
# credencial administrativa que precisa ser adicionada manualmente).
# Nota: a checagem de secret vazio precisa ser feita dentro do `run:` (shell)
# porque o contexto `secrets` não está disponível em `if:` de job.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Build (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes de integração
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY não configurado como secret do repositório — pulando testes de integração."
            exit 0
          fi
          npm test
