<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — CV CRM</title>
<meta name="description" content="Cadastre sua loja e comece a usar o CV CRM. Sem cartão de crédito.">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  /* Página de auth isolada — reaproveita .login-overlay/.login-card/.login-form
     do style.css do app (mesmo visual do login), só que como página própria
     em vez de overlay sobre o app. */
  body { display: block; min-height: 100vh; }
  .login-overlay { position: static; inset: auto; opacity: 1; visibility: visible; }
  .login-overlay.hidden { display: none; }
  .voltar-link {
      position: fixed; top: 20px; left: 20px; z-index: 2;
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.6); font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .voltar-link:hover { color: #fff; }
</style>
</head>
<body>

<a href="../" class="voltar-link">← Voltar pro site</a>

<div class="login-overlay" id="cadastroOverlay">
  <div class="login-card">
    <div class="login-icon" aria-hidden="true">CV</div>
    <h2>Criar sua conta</h2>
    <p class="subtitle">14 dias grátis, sem cartão de crédito</p>

    <form class="login-form" id="formCadastro" novalidate>
      <input type="text" id="campoNomeLoja" placeholder="Nome da loja" autocomplete="organization" required>
      <input type="text" id="campoNomeResponsavel" placeholder="Seu nome" autocomplete="name" required>
      <input type="email" id="campoEmail" placeholder="Seu e-mail" autocomplete="email" required>
      <input type="password" id="campoSenha" placeholder="Crie uma senha (mín. 8 caracteres)" autocomplete="new-password" minlength="8" required>
      <input type="password" id="campoConfirmarSenha" placeholder="Confirme a senha" autocomplete="new-password" minlength="8" required>

      <!-- Honeypot: campo invisível pra humano, mas visível pra bot de preenchimento automático. -->
      <div class="campo-honeypot" aria-hidden="true">
        <label for="campoWebsite">Deixe em branco</label>
        <input type="text" id="campoWebsite" name="website" tabindex="-1" autocomplete="off">
      </div>

      <label class="aceite-termos-row">
        <input type="checkbox" id="campoAceite">
        <span>Li e aceito os <a href="../termos/" target="_blank">Termos de Uso</a> e a <a href="../privacidade/" target="_blank">Política de Privacidade</a>.</span>
      </label>

      <button type="submit" class="login-btn" id="btnCadastrar">
        <span class="spinner"></span>
        <span class="btn-text">Criar conta grátis</span>
      </button>
    </form>
    <div class="login-msg" id="cadastroMsg" role="alert"></div>

    <p class="subtitle" style="margin-top:18px; margin-bottom:0;">Já tem conta? <a href="../app/" style="color:var(--brand-blue); font-weight:600;">Entrar</a></p>
  </div>
</div>

<!-- Estado pós-cadastro: pede confirmação por e-mail. Reaproveita a mesma
     .login-card (troca de innerHTML via JS) em vez de duplicar o markup. -->

<script type="module" src="/src/cadastro.js"></script>
</body>
</html>
